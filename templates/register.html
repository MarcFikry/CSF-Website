<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>S'inscrire</title>
    <link rel="icon" href="static/logo.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="static/login-style.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

    {% if get_flashed_messages() %}
            <header>
                <div class="alert alert-danger mb-0 text-center" role="alert">
                    {{ get_flashed_messages() | join(" ") }}
                </div>
            </header>
    {% endif %}

  <div class="wrapper">
    <div class="container main">
        <div class="row">

            <div class="col-md-6 side-image">
                <a href="/" class="d-inline-flex link-body-emphasis text-decoration-none">
                    <img src="static/unnamed.png" alt="CSF"/>
                </a>
            </div>
            
            <div class="col-md-6 right">
                
                <form class="input-box" action="/register" method="post">
                   
                   <header>Créer un compte</header>
                   <div class="input-container">
                    <div class="input-field">
                        <input type="text" class="input" name="first-name" required="" autocomplete="off">
                        <label for="first-name">Prénom</label> 
                    </div>
                    <div class="input-field">
                        <input type="text" class="input" name="last-name" required="" autocomplete="off">
                        <label for="last-name">Nom</label> 
                    </div>
                   </div>
                   <div class="input-field">
                        <input type="text" class="input" name="username" required="" autocomplete="off">
                        <label for="username">Nom d'utilisateur</label> 
                   </div> 
                   <div class="input-field">
                        <input type="password" class="input" name="password" required="">
                        <label for="pass">Mot de Passe</label>
                    </div> 
                    <div class="input-field">
                        <input type="password" class="input" name="confirmation" required="">
                        <label for="pass">Confirmer Mot de Passe</label>
                    </div> 
                   <div class="input-field">
                        <button type="submit" class="submit">S'inscrire</button>
                   </div> 
                   <div class="signin">
                    <span>Avez deja un compte? <a href="/login">S'identifier</a></span>
                   </div>
                </form>  
            </div>
        </div>
    </div>
</div>
</body>
</html>
